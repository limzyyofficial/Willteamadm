<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Admin Panel · WILZXITERZ VN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--bg2:#0d0f1c;--bg3:#111424;--card:#0f1221;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#e8eaf6;--muted:#5a6080;--dim:#2e3350;
  --sp:#1ed760;--sp2:#17b34e;--spg:rgba(30,215,96,.12);
  --nf:#e50914;--nfg:rgba(229,9,20,.12);
  --ds:#0072d2;--dsg:rgba(0,114,210,.12);
  --cv:#8B5CF6;--cvg:rgba(139,92,246,.12);
  --yt:#FF0000;--ytg:rgba(255,0,0,.12);
  --gpt:#10a37f;--gptg:rgba(16,163,127,.12);
  --ms:#00a4ef;--msg:rgba(0,164,239,.12);
  --duo:#58cc02;--duog:rgba(88,204,2,.12);
  --vpn:#4687ff;--vpng:rgba(70,135,255,.12);
  --gram:#15C39A;--gramg:rgba(21,195,154,.12);
  --gold:#f5c842;--gold2:#d4a900;
  --wa:#25d366;--wag:rgba(37,211,102,.12);
  --err:#ff4757;--warn:#ffa502;
  --r:12px;--rxl:18px;--pill:99px;
  --t:all .28s cubic-bezier(.4,0,.2,1);
  --sh:0 8px 32px rgba(0,0,0,.5);
  --nav-h:64px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:99px}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}
.mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 600px 400px at 20% 10%,rgba(30,215,96,.03) 0%,transparent 60%),radial-gradient(ellipse 500px 400px at 80% 90%,rgba(139,92,246,.035) 0%,transparent 60%)}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:48px 48px}
#loginPage{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem;background:var(--bg)}
.login-outer{width:100%;max-width:380px;animation:riseUp .55s cubic-bezier(.34,1.45,.64,1) both}
@keyframes riseUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.login-brand{text-align:center;margin-bottom:1.8rem}
.login-logo-mark{width:60px;height:60px;border-radius:18px;margin:0 auto .75rem;background:linear-gradient(135deg,rgba(30,215,96,.15),rgba(139,92,246,.15));border:1px solid rgba(30,215,96,.25);display:grid;place-items:center;font-size:1.6rem}
.login-wordmark{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.5px}
.login-wordmark em{color:var(--sp);font-style:normal}
.login-tagline{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:.25rem}
.login-card{background:var(--card);border:1px solid var(--border2);border-radius:var(--rxl);padding:1.8rem 1.6rem;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03) inset}
.login-card-stripe{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sp),var(--gold),var(--cv),var(--nf))}
.lc-head{margin-bottom:1.4rem}
.lc-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800}
.lc-sub{font-size:.74rem;color:var(--muted);margin-top:.2rem}
.field{margin-bottom:.85rem}
.field-label{display:flex;align-items:center;gap:.38rem;font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:.38rem}
.field-wrap{position:relative}
.field-ico{position:absolute;left:.82rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.82rem;pointer-events:none;transition:color .2s}
.field-inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:.68rem .88rem .68rem 2.35rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;transition:var(--t)}
.field-inp:focus{border-color:var(--sp);background:rgba(30,215,96,.04);box-shadow:0 0 0 3px rgba(30,215,96,.09)}
.field-wrap:focus-within .field-ico{color:var(--sp)}
.field-inp::placeholder{color:var(--dim)}
.pw-toggle{position:absolute;right:.82rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:4px;transition:color .2s}
.pw-toggle:hover{color:var(--sp)}
.login-alert{display:none;align-items:center;gap:.45rem;background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.2);border-radius:9px;padding:.55rem .78rem;font-size:.76rem;color:var(--err);margin-bottom:.85rem}
.login-alert.on{display:flex}
.login-submit{width:100%;padding:.82rem;border-radius:var(--pill);background:linear-gradient(135deg,var(--sp),#38f9a0);border:none;font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;color:#000;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:.45rem;position:relative;overflow:hidden}
.login-submit::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .2s}
.login-submit:hover::before{opacity:1}
.login-submit:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,215,96,.35)}
.login-submit:disabled{background:var(--dim);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none}
.ls-spin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:spin .65s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.login-hint{text-align:center;font-size:.67rem;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:.9rem}
#adminPage{display:none;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(7,8,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.tb-brand{font-family:'Syne',sans-serif;font-size:1rem;font-weight:800;letter-spacing:-.3px}
.tb-brand em{color:var(--sp);font-style:normal}
.tb-mid{flex:1;text-align:center}
.tb-page{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:700}
.tb-sub{font-size:.6rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
.tb-right{display:flex;align-items:center;gap:.45rem}
.tb-pill{display:inline-flex;align-items:center;gap:.35rem;background:rgba(30,215,96,.08);border:1px solid rgba(30,215,96,.18);padding:.22rem .65rem;border-radius:99px;font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--sp)}
.ldot{width:5px;height:5px;background:var(--sp);border-radius:50%;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.tb-icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:.82rem;transition:var(--t)}
.tb-icon-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.tb-icon-btn.danger:hover{background:rgba(255,71,87,.15);color:var(--err);border-color:rgba(255,71,87,.3)}
.tb-icon-btn.store-link:hover{background:rgba(30,215,96,.15);color:var(--sp);border-color:rgba(30,215,96,.3)}
/* WhatsApp topbar button */
.tb-icon-btn.wa-btn{border-color:rgba(37,211,102,.2)}
.tb-icon-btn.wa-btn.active{background:rgba(37,211,102,.15);color:var(--wa);border-color:rgba(37,211,102,.4)}
.tb-icon-btn.wa-btn:hover{background:rgba(37,211,102,.2);color:var(--wa);border-color:rgba(37,211,102,.4)}
.page-scroll{flex:1;overflow-y:auto;padding:1rem 1rem calc(var(--nav-h) + 1.5rem);position:relative;z-index:1}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--nav-h);background:rgba(7,8,15,.97);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom,0px)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.22rem;cursor:pointer;transition:var(--t);position:relative;border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;padding:.3rem 0}
.bn-item::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;border-radius:99px;background:var(--sp);opacity:0;transition:opacity .2s}
.bn-item.active{color:var(--sp)}
.bn-item.active::before{opacity:1}
.bn-ico{font-size:1.1rem;transition:transform .2s}
.bn-item.active .bn-ico{transform:translateY(-1px)}
.bn-lbl{font-size:.58rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.bn-badge{position:absolute;top:.22rem;right:calc(50% - 14px);min-width:16px;height:16px;padding:0 4px;background:var(--err);border-radius:99px;font-size:.55rem;font-weight:700;color:#fff;display:none;place-items:center;border:2px solid var(--bg);font-family:'JetBrains Mono',monospace}
.bn-badge.on{display:grid}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rxl);padding:1rem;position:relative;overflow:hidden;transition:var(--t)}
.stat-card:active{transform:scale(.98)}
.stat-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.12;filter:blur(20px)}
.stat-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:.88rem;margin-bottom:.6rem}
.stat-num{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;line-height:1}
.stat-lbl{font-size:.68rem;color:var(--muted);margin-top:.22rem}
.stat-note{font-size:.62rem;font-family:'JetBrains Mono',monospace;margin-top:.28rem}
.sec{background:var(--card);border:1px solid var(--border);border-radius:var(--rxl);margin-bottom:.85rem;overflow:hidden}
.sec-top{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1rem;border-bottom:1px solid var(--border)}
.sec-title{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:800;display:flex;align-items:center;gap:.45rem}
.sec-body{padding:.85rem 1rem}
.sec-action{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:600;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:.28rem .72rem;border-radius:99px;cursor:pointer;transition:var(--t)}
.sec-action:hover{color:var(--text);background:rgba(255,255,255,.09)}
.rev-hero{background:linear-gradient(135deg,rgba(30,215,96,.08),rgba(139,92,246,.06));border:1px solid rgba(30,215,96,.15);border-radius:var(--rxl);padding:1.2rem;margin-bottom:.85rem;text-align:center;position:relative;overflow:hidden}
.rev-hero::before{content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:200px;height:80px;background:rgba(30,215,96,.08);border-radius:50%;filter:blur(24px);pointer-events:none}
.rev-label{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.rev-amount{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--sp)}
.rev-sub{font-size:.7rem;color:var(--muted);margin-top:.3rem}
.order-list{display:flex;flex-direction:column;gap:.6rem}
.o-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--r);padding:.82rem .9rem;transition:var(--t)}
.o-card:active{background:rgba(255,255,255,.04)}
.o-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.55rem}
.o-id{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--sp)}
.o-name{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;margin-bottom:.12rem}
.o-contact{font-size:.72rem;color:var(--muted)}
.o-meta{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
.o-items{font-size:.72rem;color:var(--muted);flex:1;line-height:1.5}
.o-total{font-family:'Syne',sans-serif;font-weight:800;font-size:.92rem;color:var(--sp);white-space:nowrap}
.o-footer{display:flex;align-items:center;justify-content:space-between;gap:.45rem;flex-wrap:wrap}
.o-date{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--dim)}
.o-actions{display:flex;gap:.35rem;flex-wrap:wrap}
.o-source{font-family:'JetBrains Mono',monospace;font-size:.55rem;padding:.1rem .4rem;border-radius:4px}
.o-source.guest{background:rgba(255,165,2,.1);color:var(--warn);border:1px solid rgba(255,165,2,.2)}
.o-source.user{background:rgba(30,215,96,.08);color:var(--sp);border:1px solid rgba(30,215,96,.18)}
.badge{display:inline-flex;align-items:center;gap:.25rem;font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.2rem .58rem;border-radius:99px;white-space:nowrap}
.b-pending{background:rgba(255,165,2,.12);color:var(--warn);border:1px solid rgba(255,165,2,.25)}
.b-confirmed{background:rgba(30,215,96,.12);color:var(--sp);border:1px solid rgba(30,215,96,.25)}
.b-rejected{background:rgba(255,71,87,.12);color:var(--err);border:1px solid rgba(255,71,87,.25)}
.b-delivered{background:rgba(139,92,246,.12);color:var(--cv);border:1px solid rgba(139,92,246,.25)}
.abtn{display:inline-flex;align-items:center;gap:.28rem;padding:.3rem .72rem;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;transition:var(--t);font-family:'DM Sans',sans-serif;white-space:nowrap}
.abtn:active{transform:scale(.96)}
.abtn.confirm{background:rgba(30,215,96,.1);border-color:rgba(30,215,96,.25);color:var(--sp)}
.abtn.deliver{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.25);color:var(--cv)}
.abtn.reject{background:rgba(255,71,87,.08);border-color:rgba(255,71,87,.2);color:var(--err)}
.abtn.ghost{color:var(--muted)}
.abtn.del{color:var(--err)}
/* WhatsApp action button */
.abtn.wa{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.3);color:var(--wa)}
.abtn.wa:hover{background:rgba(37,211,102,.2)}
.filter-scroll{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:.85rem;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.fpill{flex-shrink:0;padding:.35rem .85rem;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer;transition:var(--t)}
.fpill.on{background:var(--text);color:#000;border-color:var(--text)}
.search-bar{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:.58rem .82rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:var(--t);margin-bottom:.85rem}
.search-bar:focus{border-color:var(--sp)}
.search-bar::placeholder{color:var(--dim)}
.stk-list{display:flex;flex-direction:column;gap:.7rem}
.stk-card{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.stk-head{display:flex;align-items:center;gap:.65rem;padding:.75rem .9rem;border-bottom:1px solid var(--border);background:rgba(255,255,255,.018)}
.stk-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:.95rem;flex-shrink:0}
.stk-icon.spotify{background:var(--spg);color:var(--sp)}
.stk-icon.netflix{background:var(--nfg);color:var(--nf)}
.stk-icon.disney{background:var(--dsg);color:var(--ds)}
.stk-icon.canva{background:var(--cvg);color:var(--cv)}
.stk-icon.youtube{background:var(--ytg);color:var(--yt)}
.stk-icon.chatgpt{background:var(--gptg);color:var(--gpt)}
.stk-icon.adobe{background:rgba(255,0,0,.1);color:#FF0000}
.stk-icon.microsoft{background:var(--msg);color:var(--ms)}
.stk-icon.duolingo{background:var(--duog);color:var(--duo)}
.stk-icon.nordvpn{background:var(--vpng);color:var(--vpn)}
.stk-icon.grammarly{background:var(--gramg);color:var(--gram)}
.stk-name{font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem}
.stk-rows{padding:.5rem .9rem}
.stk-row{display:flex;align-items:center;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid rgba(255,255,255,.04);gap:.5rem}
.stk-row:last-child{border-bottom:none}
.stk-dur{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);flex:1}
.stk-cnt{font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;margin-right:.5rem}
.stk-cnt.ok{color:var(--sp)}.stk-cnt.warn{color:var(--warn)}.stk-cnt.empty{color:var(--err)}
.stk-row-acts{display:flex;gap:.3rem}
.import-card{background:rgba(255,255,255,.025);border:1px solid rgba(30,215,96,.12);border-radius:var(--r);padding:.9rem;margin-top:.85rem}
.import-title{font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;margin-bottom:.2rem;display:flex;align-items:center;gap:.4rem}
.import-sub{font-size:.72rem;color:var(--muted);margin-bottom:.85rem}
.form-row{display:flex;gap:.55rem;margin-bottom:.7rem}
.form-row>*{flex:1}
.flabel{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem;display:block}
.finp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:.58rem .75rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;transition:var(--t)}
.finp:focus{border-color:var(--sp);box-shadow:0 0 0 3px rgba(30,215,96,.09)}
.finp::placeholder{color:var(--dim)}
select.finp{cursor:pointer}
textarea.finp{resize:vertical;min-height:90px;font-family:'JetBrains Mono',monospace;font-size:.76rem;line-height:1.7}
.fhelp{font-size:.65rem;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:.28rem}
.green-btn{width:100%;padding:.72rem;border-radius:var(--pill);background:var(--sp);border:none;font-family:'Syne',sans-serif;font-weight:800;font-size:.88rem;color:#000;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:.65rem}
.green-btn:hover{background:var(--sp2);transform:translateY(-1px)}
.green-btn:active{transform:scale(.98)}
/* WhatsApp Setup Banner */
.wa-setup-banner{background:linear-gradient(135deg,rgba(37,211,102,.08),rgba(37,211,102,.03));border:1px solid rgba(37,211,102,.2);border-radius:var(--rxl);padding:1rem;margin-bottom:.85rem;display:flex;align-items:flex-start;gap:.75rem}
.wa-setup-banner.configured{border-color:rgba(37,211,102,.35);background:linear-gradient(135deg,rgba(37,211,102,.1),rgba(37,211,102,.04))}
.wa-setup-ico{width:40px;height:40px;border-radius:11px;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.25);display:grid;place-items:center;font-size:1.1rem;flex-shrink:0;color:var(--wa)}
.wa-setup-body{flex:1;min-width:0}
.wa-setup-title{font-family:'Syne',sans-serif;font-weight:800;font-size:.85rem;margin-bottom:.18rem}
.wa-setup-sub{font-size:.72rem;color:var(--muted);line-height:1.5}
.wa-setup-num{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--wa);margin-top:.25rem}
.wa-setup-btn{display:inline-flex;align-items:center;gap:.3rem;margin-top:.5rem;padding:.28rem .72rem;border-radius:99px;border:1px solid rgba(37,211,102,.3);background:rgba(37,211,102,.1);color:var(--wa);font-size:.7rem;font-weight:600;cursor:pointer;transition:var(--t)}
.wa-setup-btn:hover{background:rgba(37,211,102,.2)}
/* WhatsApp notification toggle */
.wa-toggle-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem;margin-bottom:.5rem}
.wa-toggle-info{flex:1}
.wa-toggle-title{font-size:.82rem;font-weight:600;margin-bottom:.12rem;display:flex;align-items:center;gap:.4rem}
.wa-toggle-sub{font-size:.7rem;color:var(--muted)}
.toggle-switch{position:relative;width:42px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--dim);border-radius:99px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:var(--muted);border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--wa)}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(18px);background:#fff}
/* WhatsApp template editor */
.tpl-block{background:rgba(37,211,102,.04);border:1px solid rgba(37,211,102,.12);border-radius:10px;padding:.82rem;margin-top:.55rem}
.tpl-title{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--wa);margin-bottom:.55rem;display:flex;align-items:center;gap:.35rem}
.tpl-vars{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.55rem}
.tpl-var{font-family:'JetBrains Mono',monospace;font-size:.62rem;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.2);color:var(--wa);padding:.15rem .45rem;border-radius:5px;cursor:pointer;transition:var(--t)}
.tpl-var:hover{background:rgba(37,211,102,.2)}
/* Order settings */
.setting-block{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:var(--r);padding:.9rem;margin-bottom:.7rem}
.setting-title{font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;margin-bottom:.18rem}
.setting-sub{font-size:.72rem;color:var(--muted);margin-bottom:.9rem}
/* WhatsApp setting block special */
.setting-block.wa-block{border-color:rgba(37,211,102,.18);background:rgba(37,211,102,.03)}
.setting-block.wa-block .setting-title{color:var(--wa)}
.danger-zone{display:flex;flex-direction:column;gap:.45rem}
.danger-btn{width:100%;padding:.65rem;border-radius:10px;background:rgba(255,71,87,.07);border:1px solid rgba(255,71,87,.18);color:var(--err);font-family:'Syne',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:.38rem}
.danger-btn:active{background:rgba(255,71,87,.18)}
.info-grid{display:flex;flex-direction:column;gap:.35rem}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.78rem}
.info-row:last-child{border-bottom:none}
.info-key{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem}
.info-val{color:var(--text);font-weight:600}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(18px);z-index:3000;align-items:flex-end;justify-content:center;padding:0}
.modal-bg.on{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid var(--border2);border-radius:22px 22px 0 0;padding:1.5rem 1.3rem;position:relative;animation:sheetUp .32s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -8px 40px rgba(0,0,0,.5)}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:3.5px;background:var(--dim);border-radius:99px;margin:0 auto 1.2rem}
.modal-stripe{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sp),var(--gold),var(--cv));border-radius:22px 22px 0 0}
.modal-close{position:absolute;top:.9rem;right:.9rem;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:.75rem;transition:var(--t)}
.modal-close:hover{background:var(--err);color:#fff;border-color:var(--err)}
.modal-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:.2rem}
.modal-sub{font-size:.74rem;color:var(--muted);margin-bottom:1.1rem}
.modal-actions{display:flex;flex-direction:column;gap:.45rem;margin-top:1.1rem}
.modal-btn{width:100%;padding:.78rem;border-radius:var(--pill);border:none;font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:.4rem}
.modal-btn:active{transform:scale(.98)}
.modal-btn.primary{background:var(--sp);color:#000}
.modal-btn.primary:hover{background:var(--sp2)}
.modal-btn.danger{background:rgba(255,71,87,.12);color:var(--err);border:1px solid rgba(255,71,87,.22)}
.modal-btn.danger:hover{background:rgba(255,71,87,.2)}
.modal-btn.secondary{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.modal-btn.secondary:hover{background:rgba(255,255,255,.12);color:var(--text)}
.modal-btn.gold{background:var(--gold);color:#000}
.modal-btn.gold:hover{background:var(--gold2)}
/* WhatsApp modal button */
.modal-btn.wa{background:var(--wa);color:#000}
.modal-btn.wa:hover{background:#1ab850}
.modal-btn.wa-outline{background:rgba(37,211,102,.1);color:var(--wa);border:1px solid rgba(37,211,102,.3)}
.modal-btn.wa-outline:hover{background:rgba(37,211,102,.2)}
/* WhatsApp preview box */
.wa-preview-box{background:#0a1628;border:1px solid rgba(37,211,102,.15);border-radius:12px;padding:.9rem;margin:.7rem 0;position:relative}
.wa-preview-label{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--wa);margin-bottom:.6rem;display:flex;align-items:center;gap:.35rem}
.wa-bubble{background:#1f3a2a;border-radius:0 10px 10px 10px;padding:.65rem .8rem;font-size:.78rem;line-height:1.65;color:#d5f5e0;white-space:pre-wrap;word-break:break-word;max-width:90%;display:inline-block}
.wa-bubble-tail{display:inline-block;width:8px;height:8px;background:#1f3a2a;clip-path:polygon(100% 0,0 0,100% 100%);position:absolute;top:.9rem;left:.82rem;transform:translateX(-100%)}
#toasts{position:fixed;bottom:calc(var(--nav-h) + .7rem);left:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.35rem;align-items:center;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--sp);padding:.55rem .9rem;border-radius:10px;font-size:.76rem;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:.45rem;max-width:340px;width:100%;color:var(--text);animation:toastIn .3s cubic-bezier(.34,1.4,.64,1);box-shadow:0 4px 20px rgba(0,0,0,.45);pointer-events:all}
.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}.toast.wa{border-left-color:var(--wa)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:2.2rem 1rem}
.empty-ico{font-size:2rem;opacity:.3;margin-bottom:.55rem}
.empty-t{font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;margin-bottom:.25rem}
.empty-s{font-size:.76rem;color:var(--muted)}
.stk-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.stk-mini{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:.65rem .75rem;display:flex;align-items:center;gap:.55rem}
.stk-mini-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.82rem;flex-shrink:0}
.stk-mini-name{font-size:.75rem;font-weight:600;line-height:1.3}
.stk-mini-cnt{font-family:'JetBrains Mono',monospace;font-size:.65rem;margin-top:.1rem}
.stk-sync{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--sp);background:rgba(30,215,96,.08);border:1px solid rgba(30,215,96,.18);padding:.1rem .38rem;border-radius:4px;margin-left:.4rem}
/* WA notif pulse */
@keyframes waPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.4)}70%{box-shadow:0 0 0 8px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.wa-pulse{animation:waPulse 1.5s ease-in-out 2}
</style>
</head>

<!-- MODAL -->

<div id="toasts"></div>

<script>
/* ══════════════════════════════════════════════════════
   STORAGE KEYS:
   - wxvn_ord   → orders dari toko
   - wxvn_stk   → stok akun premium
   - wxvn_creds → kredensial admin
   - wxvn_wa    → konfigurasi WhatsApp
   - stk_{id}   → stok per produk (dipakai toko)
══════════════════════════════════════════════════════ */

var STOCK={}, ORDERS=[], CREDS={user:'admin',pass:'admin123'};

/* ═══════════════════════════════════════
   WHATSAPP CONFIG
═══════════════════════════════════════ */
var WA_CFG = {
  adminNumber: '',        // nomor WA admin, format: 6281234567890
  notifEnabled: true,     // aktifkan notif ke admin saat ada order baru
  autoOpen: true,         // otomatis buka WA saat order baru
  tplNewOrder:            // template pesan notif order baru
    '🛍️ *ORDER BARU!*\n\n' +
    'ID: {ORDER_ID}\n' +
    'Nama: {NAMA}\n' +
    'Produk: {PRODUK}\n' +
    'Total: {TOTAL}\n' +
    'Kontak: {KONTAK}\n' +
    'Waktu: {WAKTU}\n\n' +
    '👉 Cek Admin Panel untuk konfirmasi.',
  tplConfirm:             // template konfirmasi ke customer
    '✅ *Pesanan Dikonfirmasi!*\n\n' +
    'Halo {NAMA}, pesanan kamu sudah kami konfirmasi!\n\n' +
    '📋 Detail:\n' +
    'ID Order: {ORDER_ID}\n' +
    'Produk: {PRODUK}\n' +
    'Total: {TOTAL}\n\n' +
    '⏳ Akun akan segera kami kirimkan.\n' +
    'Terima kasih sudah berbelanja! 🙏',
  tplDeliver:             // template pengiriman akun ke customer
    '🎉 *Akun Sudah Dikirim!*\n\n' +
    'Halo {NAMA}, akun premiummu sudah siap!\n\n' +
    '📦 Detail Order:\n' +
    'ID: {ORDER_ID}\n' +
    'Produk: {PRODUK}\n\n' +
    '🔑 *Data Akun:*\n' +
    '{AKUN}\n\n' +
    '⚠️ Jaga kerahasiaan akunmu ya!\n' +
    'Terima kasih sudah berbelanja di WILZXITERZ VN 🙏',
  tplReject:              // template penolakan ke customer
    '❌ *Pesanan Ditolak*\n\n' +
    'Halo {NAMA}, maaf pesananmu tidak dapat kami proses.\n\n' +
    'ID Order: {ORDER_ID}\n' +
    'Alasan: {ALASAN}\n\n' +
    'Silakan hubungi kami jika ada pertanyaan. 🙏'
};

function loadWaCfg(){
  try{var w=localStorage.getItem('wxvn_wa');if(w)WA_CFG=Object.assign({},WA_CFG,JSON.parse(w));}catch(e){}
}
function saveWaCfg(){
  try{localStorage.setItem('wxvn_wa',JSON.stringify(WA_CFG));}catch(e){}
}

/* Format nomor WA: hilangkan karakter non-digit, ganti awalan 0 → 62 */
function formatWaNum(num){
  num=String(num).replace(/\D/g,'');
  if(num.startsWith('0'))num='62'+num.slice(1);
  return num;
}

/* Buka WhatsApp dengan pesan */
function openWa(number, message){
  var num=formatWaNum(number);
  if(!num){toast('Nomor WhatsApp tidak valid!','err');return;}
  var url='https://wa.me/'+num+'?text='+encodeURIComponent(message);
  window.open(url,'_blank');
}

/* Build pesan dari template + data order */
function buildWaMsg(tpl, order, extra){
  extra=extra||{};
  var produk=order.items?order.items.map(function(i){return i.name+(i.plan&&i.plan!=='—'?' ('+i.plan+')':'');}).join(', '):(order.prodName||'—');
  return tpl
    .replace(/{ORDER_ID}/g, order.id||'—')
    .replace(/{NAMA}/g, order.name||order.userName||'—')
    .replace(/{PRODUK}/g, produk)
    .replace(/{TOTAL}/g, fmt(order.total||0))
    .replace(/{KONTAK}/g, order.contact||'—')
    .replace(/{WAKTU}/g, order.date||new Date().toLocaleString('id-ID'))
    .replace(/{ALASAN}/g, extra.alasan||'Pembayaran tidak valid')
    .replace(/{AKUN}/g, extra.akun||'(lihat pesan sebelumnya)');
}

/* Notifikasi WA ke admin saat ada order baru */
function notifyAdminNewOrder(order){
  if(!WA_CFG.notifEnabled||!WA_CFG.adminNumber) return;
  var msg=buildWaMsg(WA_CFG.tplNewOrder, order);
  if(WA_CFG.autoOpen){
    openWa(WA_CFG.adminNumber, msg);
    toast('📲 WhatsApp dibuka — notifikasi order baru!','wa');
  } else {
    /* Simpan antrian notif */
    pendingWaNotif=pendingWaNotif||[];
    pendingWaNotif.push({num:WA_CFG.adminNumber,msg:msg});
    toast('🔔 Order baru! Klik WA untuk kirim notif.','wa');
    updateWaTopBtn();
  }
}

var pendingWaNotif=[];
function updateWaTopBtn(){
  var btn=document.getElementById('waTopBtn');if(!btn)return;
  if(WA_CFG.adminNumber&&WA_CFG.notifEnabled){
    btn.classList.add('active');
    btn.title='WA Notif AKTIF · '+WA_CFG.adminNumber+(pendingWaNotif&&pendingWaNotif.length?' ('+pendingWaNotif.length+' pending)':'');
  } else {
    btn.classList.remove('active');
    btn.title='WhatsApp Notifikasi (belum dikonfigurasi)';
  }
}

function toggleWaQuick(){
  /* Jika ada notif pending, kirim sekarang */
  if(pendingWaNotif&&pendingWaNotif.length){
    var n=pendingWaNotif.shift();
    openWa(n.num,n.msg);
    updateWaTopBtn();
    return;
  }
  goPage('settings');
  setTimeout(function(){
    var el=document.querySelector('.wa-block');
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  },200);
}

/* ── Daftar produk premium ── */
var PRODS=[
  {brand:'spotify',  name:'Spotify Premium',      icon:'fab fa-spotify',     plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'netflix',  name:'Netflix Premium',       icon:'fas fa-film',        plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'disney',   name:'Disney+ Hotstar',       icon:'fas fa-star',        plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'canva',    name:'Canva Pro',             icon:'fas fa-palette',     plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'youtube',  name:'YouTube Premium',       icon:'fab fa-youtube',     plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'chatgpt',  name:'ChatGPT Plus',          icon:'fas fa-robot',       plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'adobe',    name:'Adobe Creative Cloud',  icon:'fab fa-adobe',       plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'microsoft',name:'Microsoft 365',         icon:'fab fa-microsoft',   plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'duolingo', name:'Duolingo Plus',         icon:'fas fa-language',    plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'nordvpn',  name:'NordVPN Premium',       icon:'fas fa-shield-alt',  plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']},
  {brand:'grammarly',name:'Grammarly Premium',     icon:'fas fa-spell-check', plans:['1 Bulan','3 Bulan','6 Bulan','1 Tahun']}
];

var BRAND_TO_PRODID={
  spotify:'p9',netflix:'p10',disney:'p18',canva:'p12',youtube:'p11',
  chatgpt:'p13',adobe:'p17',microsoft:'p16',duolingo:'p19',nordvpn:'p15',grammarly:'p14'
};
var BRAND_CLS={
  spotify:'spotify',netflix:'netflix',disney:'disney',canva:'canva',
  youtube:'youtube',chatgpt:'chatgpt',adobe:'adobe',microsoft:'microsoft',
  duolingo:'duolingo',nordvpn:'nordvpn',grammarly:'grammarly'
};

function sKey(b,p){return b+'_'+p.replace(/\s+/g,'').toLowerCase();}
function sc(b,p){return (STOCK[sKey(b,p)]||[]).length;}
function scToko(brand){
  var pid=BRAND_TO_PRODID[brand];if(!pid)return 0;
  try{var v=JSON.parse(localStorage.getItem('stk_'+pid));return(v!==null&&v!==undefined)?v:0;}catch(e){return 0;}
}
function syncStokToToko(){
  PRODS.forEach(function(p){
    var pid=BRAND_TO_PRODID[p.brand];if(!pid)return;
    var total=p.plans.reduce(function(s,pl){return s+sc(p.brand,pl);},0);
    try{localStorage.setItem('stk_'+pid,JSON.stringify(total));}catch(e){}
  });
}
function fmt(n){return 'Rp'+Number(n).toLocaleString('id-ID');}

/* ─── Load / Save ─── */
function loadAll(){
  try{var s=localStorage.getItem('wxvn_stk');STOCK=s?JSON.parse(s):{};}catch(e){STOCK={};}
  try{var o=localStorage.getItem('wxvn_ord');ORDERS=o?JSON.parse(o):[];}catch(e){ORDERS=[];}
  try{var c=localStorage.getItem('wxvn_creds');if(c)CREDS=JSON.parse(c);}catch(e){}
  loadWaCfg();
}
function saveStock(){
  try{localStorage.setItem('wxvn_stk',JSON.stringify(STOCK));}catch(e){}
  syncStokToToko();
}
function saveOrders(){try{localStorage.setItem('wxvn_ord',JSON.stringify(ORDERS));}catch(e){}}
function saveCreds(){try{localStorage.setItem('wxvn_creds',JSON.stringify(CREDS));}catch(e){}}

/* ─── Normalisasi order ─── */
function normalizeOrder(o){
  if(o.items&&Array.isArray(o.items)){
    if(!o.name&&o.userName)o.name=o.userName;
    return o;
  }
  var brand=getBrandFromProdId(o.prodId)||'';
  return {
    id:o.id,name:o.userName||o.name||'—',contact:o.contact||'—',
    userEmail:o.userEmail||'',userId:o.userId||'',isGuest:o.isGuest||false,
    items:[{name:o.prodName||'Produk',brand:brand,plan:o.plan||'—',price:o.total||0}],
    total:o.total||0,status:o.status||'pending',statusNote:o.statusNote||'',
    date:o.date||'—',timestamp:o.timestamp||0,method:o.method||'',
    delivered:o.delivered||[],activationKey:o.activationKey||''
  };
}
function getBrandFromProdId(pid){
  var m={p9:'spotify',p10:'netflix',p18:'disney',p12:'canva',p11:'youtube',
         p13:'chatgpt',p17:'adobe',p16:'microsoft',p19:'duolingo',p15:'nordvpn',p14:'grammarly'};
  return m[pid]||'';
}
function saveOrderById(id,updatedFields){
  var rawOrders=[];
  try{var o=localStorage.getItem('wxvn_ord');rawOrders=o?JSON.parse(o):[];}catch(e){}
  var idx=rawOrders.findIndex(function(o){return o.id===id;});
  if(idx>=0){
    Object.assign(rawOrders[idx],updatedFields);
    if(updatedFields.status)rawOrders[idx].status=updatedFields.status;
    if(updatedFields.statusNote)rawOrders[idx].statusNote=updatedFields.statusNote;
    if(updatedFields.delivered)rawOrders[idx].delivered=updatedFields.delivered;
    if(updatedFields.activationKey)rawOrders[idx].activationKey=updatedFields.activationKey;
    if(updatedFields.name)rawOrders[idx].userName=updatedFields.name;
  }
  try{localStorage.setItem('wxvn_ord',JSON.stringify(rawOrders));}catch(e){}
}

/* Buka modal preview & kirim WA ke customer */
function openWaConfirm(orderId, type){
  var orders=getAllOrders();
  var o=orders.find(function(x){return x.id===orderId;});
  if(!o) return;

  var tpl, title, icon;
  if(type==='confirm'){
    tpl=WA_CFG.tplConfirm; title='Kirim Konfirmasi via WA'; icon='✅';
  } else if(type==='deliver'){
    tpl=WA_CFG.tplDeliver; title='Kirim Info Akun via WA'; icon='📦';
  } else if(type==='reject'){
    tpl=WA_CFG.tplReject; title='Kirim Penolakan via WA'; icon='❌';
  }

  var akunText='';
  if(type==='deliver'&&o.delivered&&o.delivered.length){
    akunText=o.delivered.map(function(d){return (d.name?(d.name+' ('+d.plan+'):\n'):'')+'🔑 '+d.key;}).join('\n\n');
  }

  var extra={alasan:o.statusNote||'Pembayaran tidak valid',akun:akunText||'(akun belum diisi)'};
  var msg=buildWaMsg(tpl,o,extra);

  /* Coba parse nomor customer dari contact */
  var custNum=extractPhoneNum(o.contact)||extractPhoneNum(o.userEmail||'');

  var html='<div class="modal-title">'+icon+' '+title+'</div>'
    +'<div class="modal-sub">'+o.id+' · '+o.name+'</div>'
    +'<div><label class="flabel">Nomor WhatsApp Customer</label>'
    +'<input class="finp" id="waCustNum" placeholder="6281234567890 atau 081234567890" value="'+(custNum||'')+'" style="margin-bottom:.55rem"></div>'
    +'<div class="wa-preview-box">'
    +'<div class="wa-preview-label"><i class="fab fa-whatsapp"></i> Preview Pesan</div>'
    +'<div style="position:relative;display:inline-block">'
    +'<div class="wa-bubble-tail"></div>'
    +'<div class="wa-bubble" id="waMsgPreview">'+escHtml(msg)+'</div>'
    +'</div></div>'
    +'<div><label class="flabel">Edit Pesan (Opsional)</label>'
    +'<textarea class="finp" id="waCustomMsg" style="min-height:120px" oninput="document.getElementById(\'waMsgPreview\').textContent=this.value">'+escHtml(msg)+'</textarea></div>'
    +'<div class="modal-actions">'
    +'<button class="modal-btn wa" onclick="doSendWa()"><i class="fab fa-whatsapp"></i>&nbsp;Buka WhatsApp & Kirim</button>'
    +'<button class="modal-btn secondary" onclick="closeModal()">Batal</button>'
    +'</div>';

  openModal(html);
}

function doSendWa(){
  var num=document.getElementById('waCustNum').value.trim();
  var msg=document.getElementById('waCustomMsg').value.trim();
  if(!num){toast('Masukkan nomor WhatsApp customer!','err');return;}
  if(!msg){toast('Pesan tidak boleh kosong!','err');return;}
  openWa(num,msg);
  closeModal();
  toast('📲 WhatsApp dibuka!','wa');
}

function extractPhoneNum(str){
  if(!str)return '';
  var m=str.match(/(\+?62|0)\d{8,13}/);
  return m?m[0]:'';
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ─── Orders ─── */
function renderOrders(){
  var allOrders=getAllOrders();
  var pend=allOrders.filter(function(o){return o.status==='pending';}).length;
  var conf=allOrders.filter(function(o){return o.status==='confirmed';}).length;
  var delv=allOrders.filter(function(o){return o.status==='delivered';}).length;
  var rej=allOrders.filter(function(o){return o.status==='rejected';}).length;
  var html='<div class="filter-scroll">'
    +fpill('all','Semua ('+allOrders.length+')')
    +fpill('pending','Pending ('+pend+')')
    +fpill('confirmed','Konfirmasi ('+conf+')')
    +fpill('delivered','Terkirim ('+delv+')')
    +fpill('rejected','Ditolak ('+rej+')')
    +'</div>';
  html+='<input class="search-bar" placeholder="🔍  Cari nama / Order ID / Email..." value="'+ordSearch+'" oninput="ordSearch=this.value;renderOrders()">';
  var list=allOrders.filter(function(o){
    var mf=ordFilter==='all'||o.status===ordFilter;
    var q=ordSearch.toLowerCase();
    var ms=!q||(o.id.toLowerCase().includes(q)||o.name.toLowerCase().includes(q)||o.contact.toLowerCase().includes(q)||(o.userEmail||'').toLowerCase().includes(q));
    return mf&&ms;
  });
  if(ordFilter==='pending'&&list.length>0){
    html+='<div style="margin-bottom:.85rem"><button class="green-btn" style="margin-top:0" onclick="confirmAllPending()"><i class="fas fa-check-double"></i>&nbsp;Konfirmasi Semua Pending ('+list.length+')</button></div>';
  }
  html+='<div class="order-list">';
  if(!list.length){
    html+='<div class="empty"><div class="empty-ico">📋</div><div class="empty-t">Tidak ada order</div><div class="empty-s">Coba filter lain</div></div>';
  } else {
    list.forEach(function(o){html+=renderOrderCard(o);});
  }
  html+='</div>';
  document.getElementById('pageScroll').innerHTML=html;
}

function setFilt(v){ordFilter=v;renderOrders();}
function getStInfo(s){

  }
  if(o.status==='delivered'){
    /* WA: Kirim akun via WA */
    acts+='<button class="abtn wa" title="Kirim Akun via WhatsApp" onclick="openWaConfirm(\''+o.id+'\',\'deliver\')"><i class="fab fa-whatsapp"></i> WA</button>';
  }
  if(o.status==='rejected'){
    acts+='<button class="abtn wa" title="Beritahu via WA" onclick="openWaConfirm(\''+o.id+'\',\'reject\')"><i class="fab fa-whatsapp"></i></button>';
  }
  acts+='<button class="abtn ghost" onclick="viewOrder(\''+o.id+'\')"><i class="fas fa-eye"></i></button>';
  acts+='<button class="abtn del" onclick="deleteOrder(\''+o.id+'\')"><i class="fas fa-trash"></i></button>';

  return '<div class="o-card">'
    +'<div class="o-card-top"><div><div class="o-id">'+o.id+' '+sourceBadge+'</div><div class="o-name">'+o.name+'</div><div class="o-contact">'+o.contact+(o.userEmail?' · '+o.userEmail:'')+'</div></div>'

    +'<div class="o-meta"><div class="o-items">'+itemTxt+'</div><div class="o-total">'+fmt(o.total)+'</div></div>'
    +'<div class="o-footer"><div class="o-date">'+o.date+'</div><div class="o-actions">'+acts+'</div></div>'
    +'</div>';

function updateOrderStatus(id,fields){
  saveOrderById(id,fields);
  loadAll();
}

function confirmOrder(id){
  updateOrderStatus(id,{status:'confirmed'});
  updateBadge();
  /* Auto notif WA ke admin jika nomor ada */
  var orders=getAllOrders();
  var o=orders.find(function(x){return x.id===id;});
  if(o&&WA_CFG.adminNumber&&WA_CFG.notifEnabled){
    /* Notif admin bahwa order sudah dikonfirmasi */
    var msg='✅ *Order Dikonfirmasi*\n\nID: '+o.id+'\nNama: '+o.name+'\nProduk: '+(o.items?o.items.map(function(i){return i.name;}).join(', '):'—')+'\nTotal: '+fmt(o.total)+'\n\n📦 Siapkan akun untuk dikirimkan.';
    if(WA_CFG.autoOpen) openWa(WA_CFG.adminNumber,msg);
  }
  if(curPage==='orders')renderOrders();else renderDashboard();
  toast('✅ Order '+id+' dikonfirmasi!');
}

function confirmAllPending(){
  var rawOrders=[];
  try{var o=localStorage.getItem('wxvn_ord');rawOrders=o?JSON.parse(o):[];}catch(e){}
  var n=0;
  rawOrders.forEach(function(o){if(o.status==='pending'){o.status='confirmed';n++;}});
  try{localStorage.setItem('wxvn_ord',JSON.stringify(rawOrders));}catch(e){}
  loadAll();updateBadge();
  if(curPage==='orders')renderOrders();else renderDashboard();
  toast('✅ '+n+' order dikonfirmasi!');
}

function deleteOrder(id){
  if(!confirm('Hapus order '+id+'?'))return;
  var rawOrders=[];
  try{var o=localStorage.getItem('wxvn_ord');rawOrders=o?JSON.parse(o):[];}catch(e){}
  rawOrders=rawOrders.filter(function(o){return o.id!==id;});
  try{localStorage.setItem('wxvn_ord',JSON.stringify(rawOrders));}catch(e){}
  loadAll();updateBadge();
  if(curPage==='orders')renderOrders();else renderDashboard();
  toast('Order dihapus','err');
}

function openReject(id){

function doReject(id){

}

function doRejectAndWa(id){
  var r=document.getElementById('rejReason').value.trim()||'Pembayaran tidak valid';
  updateOrderStatus(id,{status:'rejected',statusNote:r});
  loadAll();updateBadge();closeModal();
  if(curPage==='orders')renderOrders();else renderDashboard();

function openDeliver(id){
  var orders=getAllOrders();
  var o=orders.find(function(x){return x.id===id;});if(!o)return;
  var iHtml=o.items.map(function(item,i){
    var n=item.brand?sc(item.brand,item.plan||''):0;
    var stk=item.brand?(STOCK[sKey(item.brand,item.plan||'')]||[]):[];
    return '<div style="margin-bottom:.75rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:.75rem">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:.45rem"><span style="font-size:.8rem;font-weight:700">'+item.name+(item.plan&&item.plan!=='—'?' · '+item.plan:'')+'</span>'
      +(item.brand?'<span style="font-family:\'JetBrains Mono\',monospace;font-size:.65rem;color:'+(n>0?'var(--sp)':'var(--err)')+'">Stok: '+n+'</span>':'')+'</div>'
      +'<label class="flabel">AKUN / KUNCI</label>'

    +'<div class="modal-actions">'
    +'<button class="modal-btn gold" onclick="doDeliver(\''+id+'\')"><i class="fas fa-paper-plane"></i>&nbsp;Kirim & Selesaikan</button>'
    +'<button class="modal-btn wa" onclick="doDeliverAndWa(\''+id+'\')"><i class="fab fa-whatsapp"></i>&nbsp;Kirim + WA Customer</button>'
    +'<button class="modal-btn secondary" onclick="closeModal()">Batal</button></div>');
}

function doDeliver(id, andWa){
  var orders=getAllOrders();
  var o=orders.find(function(x){return x.id===id;});if(!o)return;
  var delivered=[];var ok=true;
  o.items.forEach(function(item,i){
    var el=document.getElementById('dk_'+i);if(!el)return;
    var val=el.value.trim();if(!val){ok=false;return;}
    delivered.push({name:item.name,plan:item.plan||'',brand:item.brand||'',key:val});
    if(item.brand){
      var k=sKey(item.brand,item.plan||'');
      if(STOCK[k]&&STOCK[k].length&&STOCK[k][0]===val){
        STOCK[k].shift();saveStock();
      }
    }
  });
  if(!ok){toast('Isi semua kunci akun!','err');return;}
  var aKey=delivered.map(function(d){return d.key;}).join('\n---\n');
  updateOrderStatus(id,{status:'delivered',delivered:delivered,activationKey:aKey});
  loadAll();updateBadge();closeModal();
  if(curPage==='orders')renderOrders();else renderDashboard();
  toast('🎉 Akun terkirim ke '+o.name+'!');
  if(andWa){
    setTimeout(function(){openWaConfirm(id,'deliver');},350);
  }
}

function doDeliverAndWa(id){
  doDeliver(id,true);
}

    var tcol=tot===0?'var(--err)':tot<=5?'var(--warn)':'var(--sp)';
    html+='<div class="stk-card"><div class="stk-head">'
      +'<div class="stk-icon '+BRAND_CLS[p.brand]+'"><i class="'+p.icon+'"></i></div>'
      +'<div><div class="stk-name">'+p.name+'<span class="stk-sync">⟳ toko</span></div>'
      +'<div style="font-family:\'JetBrains Mono\',monospace;font-size:.62rem;color:'+tcol+'">'+tot+' akun tersedia</div></div>'
      +'</div><div class="stk-rows">';

        +'<button class="abtn ghost" onclick="viewStk(\''+p.brand+'\',\''+p.name+'\',\''+pl+'\')"><i class="fas fa-eye"></i></button>'
        +'</div></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  html+='<div class="import-card"><div class="import-title"><i class="fas fa-file-import" style="color:var(--gold)"></i>&nbsp;Import Stok Massal</div>'
    +'<div class="import-sub">Tambah banyak akun sekaligus, satu akun per baris.</div>'
    +'<div class="form-row">'
    +'<div><label class="flabel">Produk</label><select class="finp" id="impBrand">'+PRODS.map(function(p){return '<option value="'+p.brand+'">'+p.name+'</option>';}).join('')+'</select></div>'
    +'<div><label class="flabel">Paket</label><select class="finp" id="impPlan"><option>1 Bulan</option><option>3 Bulan</option><option>6 Bulan</option><option>1 Tahun</option></select></div>'
    +'</div>'

    +'<button class="green-btn" onclick="doImport()"><i class="fas fa-upload"></i>&nbsp;Import Sekarang</button></div>';
  document.getElementById('pageScroll').innerHTML=html;

function openAddStk(brand,name,plan){
  openModal('<div class="modal-title">➕ Tambah Stok</div><div class="modal-sub">'+name+' · '+plan+' · Saat ini: '+sc(brand,plan)+' akun</div>'
    +'<div><label class="flabel">AKUN / KUNCI (satu per baris)</label><textarea class="finp" id="newStkKeys" placeholder="email:password&#10;kode_akun..." style="min-height:110px"></textarea></div>'
    +'<div class="modal-actions"><button class="modal-btn primary" onclick="doAddStk(\''+brand+'\',\''+plan+'\')"><i class="fas fa-plus"></i>&nbsp;Tambah Stok</button><button class="modal-btn secondary" onclick="closeModal()">Batal</button></div>');
}
function doAddStk(brand,plan){
  var keys=document.getElementById('newStkKeys').value.trim().split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(!keys.length){toast('Masukkan minimal 1 akun','err');return;}
  var k=sKey(brand,plan);if(!STOCK[k])STOCK[k]=[];
  STOCK[k]=STOCK[k].concat(keys);
  saveStock();closeModal();renderStock();
  toast('✅ '+keys.length+' akun ditambahkan & tersinkron ke toko!');
}
function viewStk(brand,name,plan){
  var items=(STOCK[sKey(brand,plan)]||[]);
  var listHtml=items.length?items.map(function(it,i){
    return '<div style="display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:.38rem .65rem;margin-bottom:.3rem;gap:.4rem">'
      +'<span style="font-family:\'JetBrains Mono\',monospace;font-size:.72rem;color:var(--sp);word-break:break-all;flex:1">'+it+'</span>'
      +'<button class="abtn del" onclick="rmStk(\''+brand+'\',\''+plan+'\','+i+')"><i class="fas fa-times"></i></button></div>';
  }).join(''):'<div class="empty"><div class="empty-ico">📦</div><div class="empty-t">Stok kosong</div></div>';
  openModal('<div class="modal-title">Stok: '+name+'</div><div class="modal-sub">'+plan+' · '+items.length+' akun</div>'
    +'<div style="max-height:300px;overflow-y:auto">'+listHtml+'</div>'
    +'<div class="modal-actions">'+(items.length?'<button class="modal-btn danger" onclick="clearStk(\''+brand+'\',\''+plan+'\')"><i class="fas fa-trash"></i>&nbsp;Hapus Semua</button>':'')
    +'<button class="modal-btn secondary" onclick="closeModal()">Tutup</button></div>');
}
function rmStk(brand,plan,idx){
  var k=sKey(brand,plan);if(STOCK[k])STOCK[k].splice(idx,1);
  saveStock();closeModal();renderStock();toast('Akun dihapus dari stok','warn');
}
function clearStk(brand,plan){
  if(!confirm('Hapus semua stok?'))return;
  STOCK[sKey(brand,plan)]=[];saveStock();closeModal();renderStock();toast('Stok dikosongkan','warn');
}
function doImport(){
  var brand=document.getElementById('impBrand').value;
  var plan=document.getElementById('impPlan').value;
  var keys=document.getElementById('impKeys').value.trim().split('\n').map(function(s){return s.trim();}).filter(Boolean);
  if(!keys.length){toast('Masukkan minimal 1 akun','err');return;}
  var k=sKey(brand,plan);if(!STOCK[k])STOCK[k]=[];
  STOCK[k]=STOCK[k].concat(keys);
  saveStock();document.getElementById('impKeys').value='';
  renderStock();toast('✅ '+keys.length+' akun diimport & tersinkron ke toko!');
}

    +'<div class="info-row"><span class="info-key">Versi Panel</span><span class="info-val" style="color:var(--gold)">v2.1.0-WA</span></div>'
    +'<div class="info-row"><span class="info-key">Link Toko</span><a href="index.html" target="_blank" style="color:var(--sp);font-size:.78rem;font-weight:600">Buka Toko <i class="fas fa-external-link-alt"></i></a></div>'
    +'</div></div>';

  document.getElementById('pageScroll').innerHTML=html;
}

function toggleWaTpls(){
  var el=document.getElementById('waTplsBlock');
  if(el)el.style.display=(el.style.display==='none'?'block':'none');
}

function insertVar(fieldId, varStr){
  var el=document.getElementById(fieldId);
  if(!el)return;
  var start=el.selectionStart, end=el.selectionEnd;
  el.value=el.value.substring(0,start)+varStr+el.value.substring(end);
  el.focus();el.setSelectionRange(start+varStr.length,start+varStr.length);
}

function clearDoneOrders(){
  if(!confirm('Hapus order selesai & ditolak?'))return;
  var rawOrders=[];
  try{var o=localStorage.getItem('wxvn_ord');rawOrders=o?JSON.parse(o):[];}catch(e){}
  rawOrders=rawOrders.filter(function(o){return o.status==='pending'||o.status==='confirmed';});
  try{localStorage.setItem('wxvn_ord',JSON.stringify(rawOrders));}catch(e){}
  loadAll();renderSettings();toast('Selesai','warn');
}
function clearAllOrders(){
  if(!confirm('HAPUS SEMUA ORDER? Tidak bisa dibatalkan!'))return;
  try{localStorage.setItem('wxvn_ord',JSON.stringify([]));}catch(e){}
  loadAll();renderSettings();toast('Semua order dihapus','err');
}
function clearAllStk(){
  if(!confirm('RESET SEMUA STOK? Tidak bisa dibatalkan!'))return;
  STOCK={};saveStock();loadAll();renderSettings();toast('Semua stok direset','err');
}

/* ═══════════════════════════════════════
   AUTO-DETECT ORDER BARU (Polling localStorage)
   Deteksi order pending baru → trigger notif WA ke admin
═══════════════════════════════════════ */
var _lastOrderCount=-1;
var _lastOrderIds=null;

function checkNewOrders(){
  if(document.getElementById('adminPage').style.display==='none')return;
  var rawOrders=[];
  try{var o=localStorage.getItem('wxvn_ord');rawOrders=o?JSON.parse(o):[];}catch(e){}
  var pendingOrders=rawOrders.filter(function(o){return o.status==='pending';});
  var currentIds=pendingOrders.map(function(o){return o.id;}).join(',');
  if(_lastOrderIds===null){
    _lastOrderIds=currentIds;
    _lastOrderCount=pendingOrders.length;
    return;
  }
  /* Cek order baru: ada ID yang belum ada sebelumnya */
  var prevIds=_lastOrderIds?_lastOrderIds.split(',').filter(Boolean):[];
  var newOrders=pendingOrders.filter(function(o){return!prevIds.includes(o.id);});
  if(newOrders.length){
    newOrders.forEach(function(o){
      var normalized=normalizeOrder(o);
      /* Notif WA ke admin */
      if(WA_CFG.notifEnabled&&WA_CFG.adminNumber){
        notifyAdminNewOrder(normalized);
      } else {
        toast('🛍️ Order baru: '+normalized.name+'! ('+normalized.id+')');
      }
    });
    /* Refresh tampilan */
    loadAll();updateBadge();
    if(curPage==='orders')renderOrders();
    else if(curPage==='dashboard')renderDashboard();
    /* Efek pulse pada badge */
    var badge=document.getElementById('pendBadge');
    if(badge){badge.classList.add('wa-pulse');setTimeout(function(){badge.classList.remove('wa-pulse');},3000);}
  }
  _lastOrderIds=currentIds;
  _lastOrderCount=pendingOrders.length;
}

/* ─── Modal ─── */
function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function handleModalBgClick(e){if(e.target===document.getElementById('modal'))closeModal();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ─── Toast ─── */
function toast(msg,type){
  var t=document.createElement('div');
  t.className='toast'+(type==='err'?' err':type==='warn'?' warn':type==='wa'?' wa':'');
  t.innerHTML='<span>'+(type==='err'?'❌':type==='warn'?'⚠️':type==='wa'?'📲':'✅')+'</span><span>'+msg+'</span>';
  document.getElementById('toasts').appendChild(t);
  setTimeout(function(){t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translateY(8px)';setTimeout(function(){t.remove();},320);},3500);
}

/* ─── Polling: cek order baru tiap 10 detik ─── */
setInterval(checkNewOrders, 10000);
/* ─── Refresh badge tiap 30 detik ─── */
setInterval(function(){
  if(document.getElementById('adminPage').style.display!=='none'){
    loadAll();updateBadge();
  }
},30000);

loadAll();
